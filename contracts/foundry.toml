[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
evm_version = "cancun" # Robinhood Chain (ArbOS 61) runs Cancun; the Universal Router uses transient storage

[fmt]
line_length = 120

# Independent BNB adapter tests require no legacy Uniswap/forge-std dependencies.
[profile.bnb]
src = "src/bnb"
test = "test/bnb"
out = "out/bnb"
cache_path = "cache/bnb"
libs = []
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
evm_version = "paris"
