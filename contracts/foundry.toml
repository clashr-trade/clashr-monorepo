# Current Clashr integration: direct Flap Portal calls on BNB Chain.
[profile.default]
src = "src/flap"
test = "test/flap"
out = "out/flap"
cache_path = "cache/flap"
libs = []
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 10000
# BNB supports Cancun (Tycho); live Portal fork reads require modern EVM opcodes.
evm_version = "cancun"

# Compatibility alias for existing BNB check commands.
[profile.bnb]
src = "src/flap"
test = "test/flap"

# Retained Four.meme draft, not used by the current Flap application.
[profile.fourmeme]
src = "src/bnb"
test = "test/bnb"
out = "out/fourmeme"
cache_path = "cache/fourmeme"
evm_version = "paris"

# Original Robinhood/PONS/Uniswap drafts; requires forge-std.
[profile.legacy]
src = "src"
test = "test"
out = "out/legacy"
cache_path = "cache/legacy"
libs = ["lib"]
evm_version = "cancun"

[fmt]
line_length = 120
