name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.9.0

      - name: Format
        run: forge fmt --check src/flap test/flap

      - name: Build
        run: forge build --sizes

      # Standalone contracts checkout only. The monorepo's active CI also checks SDK ABI parity.
      # Missing RPC configuration is reported as an explicit skip, never a successful fork check.
      - name: Test
        run: forge test -vv
        env:
          BSC_RPC_URL: ${{ secrets.BSC_RPC_URL }}
          FLAP_FORK_TOKEN: ${{ vars.FLAP_FORK_TOKEN || '0x0000000000000000000000000000000000000000' }}
          FLAP_FORK_BLOCK: ${{ vars.FLAP_FORK_BLOCK || '0' }}
