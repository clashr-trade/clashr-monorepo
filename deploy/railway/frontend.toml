[build]
builder = "RAILPACK"
buildCommand = "npm run build:web"
watchPatterns = ["apps/web/**", "packages/**", "scripts/**", "docs/**", "patches/**", "package.json", "pnpm-lock.yaml", "pnpm-workspace.yaml", "deploy/railway/frontend.toml"]

[deploy]
startCommand = "npm run start:railway:web"
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
drainingSeconds = 10
